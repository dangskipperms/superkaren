    <link rel="stylesheet" href="rig/stage.css">
  </head>
  <body>
    <div data-hf-id="hf-dxb8" id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <div data-hf-id="hf-n6oz" id="bg" class="clip" data-start="0" data-duration="24" data-track-index="0"></div>
      <div data-hf-id="hf-7hpb" id="caption" class="clip" data-start="0" data-duration="24" data-track-index="1">One SVG rig. Pure code. No images.</div>
      <svg data-hf-id="hf-aysh" id="rig" class="clip" data-start="0" data-duration="24" data-track-index="2" data-layout-allow-overflow="" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" />
    </div>
    <script src="rig/util.js"></script>
    <script src="rig/markup.js"></script>
    <script src="rig/poses.js"></script>

    <script src="rig/face.js"></script>
    <script src="rig/reel.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 24, duration: 24, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      draw(0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
